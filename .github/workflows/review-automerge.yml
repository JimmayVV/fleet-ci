name: Review auto-merge

# Arms auto-merge on a risk:medium PR once the review bot posts a comment
# ending in "VERDICT: clean". Call this from an `issue_comment` (types:
# [created]) workflow in the project repo.
#
# Guards: the PR must carry risk:medium, and the comment must come from a bot
# or from the repository owner. A drive-by contributor pasting the verdict
# line does not qualify.

on:
  workflow_call:
    inputs:
      merge-method:
        type: string
        default: squash
      allowed-bots:
        description: Newline-separated bot logins allowed to issue a verdict
        type: string
        # claude[bot] is who actually posts the review: claude-code-action
        # comments as the Claude GitHub App, not as github-actions. With only
        # github-actions listed, no risk:medium PR could ever arm.
        default: |
          github-actions[bot]
          claude[bot]
          claude[bot]

permissions:
  contents: write
  pull-requests: write

jobs:
  arm:
    name: Arm auto-merge (medium)
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'VERDICT: clean')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check author and label
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.comment.user.login }}
          AUTHOR_TYPE: ${{ github.event.comment.user.type }}
          ASSOC: ${{ github.event.comment.author_association }}
          BOTS: ${{ inputs.allowed-bots }}
          BODY: ${{ github.event.comment.body }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          ok=false
          # The verdict must be the last non-empty line, not merely quoted somewhere.
          last=$(printf '%s\n' "$BODY" | tr -d '\r' | sed -e 's/[[:space:]]*$//' | grep -v '^$' | tail -n1)
          [ "$last" = "VERDICT: clean" ] || { echo "last line is not a clean verdict: $last"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "$ASSOC" = "OWNER" ]; then ok=true; fi
          if [ "$AUTHOR_TYPE" = "Bot" ] && printf '%s\n' "$BOTS" | grep -qxF "$AUTHOR"; then ok=true; fi
          labels=$(gh pr view "$PR" --json labels -q '.labels[].name')
          echo "$labels" | grep -qx 'risk:medium' || ok=false
          # The verdict must be for the PR as it stands. A review of an older
          # commit can post its comment after a newer commit was pushed, and the
          # bot posts before its own run finishes. So wait for the Review run of
          # the current head to finish, then judge by the bot's latest comment
          # since that run started: a stale clean verdict loses to it.
          head=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          for _ in $(seq 1 40); do
            runs=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$head&event=pull_request&per_page=50" \
              | jq --arg wf "$WORKFLOW" '[.workflow_runs[] | select(.name == $wf)]')
            running=$(printf '%s' "$runs" | jq '[.[] | select(.status != "completed")] | length')
            [ "$running" -eq 0 ] && break
            sleep 15
          done
          started=$(printf '%s' "$runs" | jq -r '[.[] | select(.status == "completed" and .conclusion == "success")] | sort_by(.run_started_at) | last | .run_started_at // empty')
          if [ "$running" -ne 0 ] || [ -z "$started" ]; then
            echo "no finished review of head ${head:0:7}; not arming"
            ok=false
          else
            latest=$(gh api "repos/$GH_REPO/issues/$PR/comments?per_page=100" --paginate \
              | jq -rs --arg a "$AUTHOR" --arg t "$started" \
                '[.[][] | select(.user.login == $a and .created_at >= $t)] | sort_by(.created_at) | last | .body // ""' \
              | tr -d '\r' | sed -e 's/[[:space:]]*$//' | grep -v '^$' | tail -n1)
            if [ "$latest" != "VERDICT: clean" ]; then
              echo "latest verdict on head ${head:0:7} is not clean: $latest; not arming"
              ok=false
            fi
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "author=$AUTHOR type=$AUTHOR_TYPE assoc=$ASSOC labels=[$labels] -> $ok"
      - name: Resolve base branch
        if: steps.check.outputs.ok == 'true'
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: echo "ref=$(gh pr view "$PR" --json baseRefName -q .baseRefName)" >> "$GITHUB_OUTPUT"
      - name: Require a ruleset with status checks
        if: steps.check.outputs.ok == 'true'
        id: guard
        uses: JimmayVV/fleet-ci/.github/actions/merge-guard@v1
        with:
          base: ${{ steps.base.outputs.ref }}
      - name: Enable auto-merge
        if: steps.check.outputs.ok == 'true' && steps.guard.outputs.protected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: gh pr merge --auto --${{ inputs.merge-method }} "$PR"
