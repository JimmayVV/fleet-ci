name: Node CI

# Reusable CI for the fleet's TypeScript repos.
# Every step maps to a package.json script; a repo opts out of a step by
# setting the matching input to false. Steps that are on run against the
# script name given (defaults match the fleet baseline).

on:
  workflow_call:
    inputs:
      package-manager:
        description: npm or bun
        type: string
        default: bun
      node-version-file:
        description: File that pins Node (ignored for bun unless set)
        type: string
        default: .nvmrc
      bun-version:
        description: Bun version, or "latest"
        type: string
        default: latest
      lint:
        type: boolean
        default: true
      lint-script:
        type: string
        default: lint
      format-check:
        type: boolean
        default: false
      format-script:
        type: string
        default: format:check
      typecheck:
        type: boolean
        default: true
      typecheck-script:
        type: string
        default: typecheck
      test:
        type: boolean
        default: true
      test-script:
        type: string
        default: test
      build:
        type: boolean
        default: true
      build-script:
        type: string
        default: build
      build-env:
        description: KEY=VALUE lines exported before the build step
        type: string
        default: ""
      playwright:
        description: Run Playwright after build
        type: boolean
        default: false
      playwright-script:
        type: string
        default: test:e2e
      playwright-browsers:
        type: string
        default: chromium
      playwright-timeout:
        type: number
        default: 15
      turbo-cache:
        description: Cache Turborepo's local .turbo directory in every job
        type: boolean
        default: false
    secrets:
      build-secrets:
        description: KEY=VALUE lines exported before build and e2e, from the caller's secrets
        required: false

permissions:
  contents: read

jobs:
  checks:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup toolchain
        uses: JimmayVV/fleet-ci/.github/actions/setup-node-pm@v1
        with:
          package-manager: ${{ inputs.package-manager }}
          node-version-file: ${{ inputs.node-version-file }}
          bun-version: ${{ inputs.bun-version }}
      - name: Cache Turborepo
        if: inputs.turbo-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Lint
        if: inputs.lint
        run: ${{ inputs.package-manager }} run ${{ inputs.lint-script }}
      - name: Format check
        if: inputs.format-check
        run: ${{ inputs.package-manager }} run ${{ inputs.format-script }}
      - name: Typecheck
        if: inputs.typecheck
        run: ${{ inputs.package-manager }} run ${{ inputs.typecheck-script }}

  test:
    name: Unit Tests
    if: inputs.test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup toolchain
        uses: JimmayVV/fleet-ci/.github/actions/setup-node-pm@v1
        with:
          package-manager: ${{ inputs.package-manager }}
          node-version-file: ${{ inputs.node-version-file }}
          bun-version: ${{ inputs.bun-version }}
      - name: Cache Turborepo
        if: inputs.turbo-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Test
        run: ${{ inputs.package-manager }} run ${{ inputs.test-script }}

  build:
    name: Build
    if: inputs.build && !cancelled() && !failure()
    needs: [checks, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup toolchain
        uses: JimmayVV/fleet-ci/.github/actions/setup-node-pm@v1
        with:
          package-manager: ${{ inputs.package-manager }}
          node-version-file: ${{ inputs.node-version-file }}
          bun-version: ${{ inputs.bun-version }}
      - name: Cache Turborepo
        if: inputs.turbo-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Export build env
        if: inputs.build-env != '' || env.BUILD_SECRETS != ''
        run: printf '%s\n%s\n' "$BUILD_ENV" "$BUILD_SECRETS" | grep -v '^\s*$' >> "$GITHUB_ENV"
        env:
          BUILD_ENV: ${{ inputs.build-env }}
          BUILD_SECRETS: ${{ secrets.build-secrets }}
      - name: Build
        run: ${{ inputs.package-manager }} run ${{ inputs.build-script }}

  e2e:
    name: E2E Tests
    if: inputs.playwright && !cancelled() && !failure()
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.playwright-timeout }}
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup toolchain
        uses: JimmayVV/fleet-ci/.github/actions/setup-node-pm@v1
        with:
          package-manager: ${{ inputs.package-manager }}
          node-version-file: ${{ inputs.node-version-file }}
          bun-version: ${{ inputs.bun-version }}
      - name: Cache Turborepo
        if: inputs.turbo-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Install Playwright browsers
        run: ${{ inputs.package-manager == 'bun' && 'bunx' || 'npx' }} playwright install --with-deps ${{ inputs.playwright-browsers }}
      - name: Export build env
        if: inputs.build-env != '' || env.BUILD_SECRETS != ''
        run: printf '%s\n%s\n' "$BUILD_ENV" "$BUILD_SECRETS" | grep -v '^\s*$' >> "$GITHUB_ENV"
        env:
          BUILD_ENV: ${{ inputs.build-env }}
          BUILD_SECRETS: ${{ secrets.build-secrets }}
      - name: Run Playwright
        run: ${{ inputs.package-manager }} run ${{ inputs.playwright-script }}
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
